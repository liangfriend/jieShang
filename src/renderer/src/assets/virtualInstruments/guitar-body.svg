<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" width="400" height="1000">
  <!--
    Steel-string acoustic, front view.
    Scale length 520 units (nut 148 -> saddle 668).
    20 frets, equal temperament; 14th fret meets the body.
    Soundboard is an OM figure-8: round upper/lower bouts, concave waist,
    quarter-ellipse bottom with a horizontal tangent (not pointed).
  -->
