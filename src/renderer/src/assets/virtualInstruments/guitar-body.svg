         C 294.00 667.76, 358.00 710.24, 358.00 748.00
         C 358.00 814.27, 287.26 868.00, 200.00 868.00
         C 112.74 868.00, 42.00 814.27, 42.00 748.00
         C 42.00 710.24, 106.00 667.76, 106.00 630.00
         C 106.00 603.76, 82.00 574.24, 82.00 548.00
         C 82.00 486.35, 136.00 444.37, 178.00 436.37
         Z"/>
    <clipPath id="bodyClip">
      <use href="#bodyOutline"/>
    </clipPath>
  </defs>

  <use href="#bodyOutline" fill="url(#soundboard)"/>

  <g clip-path="url(#bodyClip)" stroke="#A56B38" stroke-width="0.65" opacity="0.22">
