      <stop offset="0%" stop-color="#C48A4A"/>
      <stop offset="22%" stop-color="#E2B57A"/>
      <stop offset="50%" stop-color="#F3D09A"/>
      <stop offset="78%" stop-color="#E0B174"/>
      <stop offset="100%" stop-color="#C08648"/>
    </linearGradient>
    <linearGradient id="neckWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A301C"/>
      <stop offset="50%" stop-color="#7A5230"/>
      <stop offset="100%" stop-color="#3F2818"/>
    </linearGradient>
    <linearGradient id="headWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A1810"/>
      <stop offset="50%" stop-color="#4A3220"/>
      <stop offset="100%" stop-color="#24140C"/>
    </linearGradient>
    <radialGradient id="holeDepth" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4A3018"/>
      <stop offset="55%" stop-color="#1A0E08"/>
      <stop offset="100%" stop-color="#090604"/>
    </radialGradient>
