<?xml version="1.0" encoding="UTF-8"?>
<!-- Steam Library Hero 3840×1240：纯背景美术，禁止文字/Logo（Logo 用 library-logo） -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1240" viewBox="0 0 3840 1240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F9"/>
      <stop offset="40%" stop-color="#F3EBFF"/>
      <stop offset="100%" stop-color="#E8F4FF"/>
    </linearGradient>
    <linearGradient id="glow-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB8D0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFB8D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-lilac" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9B8FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C9B8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-sky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#B8E4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#B8E4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="staff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8FB8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9B8FF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8FB8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FF8FB8" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#C9B8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B8E4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底色 -->
  <rect width="3840" height="1240" fill="url(#bg)"/>

  <!-- 大色晕 -->
  <circle cx="520" cy="180" r="520" fill="url(#glow-pink)"/>
  <circle cx="3380" cy="200" r="560" fill="url(#glow-lilac)"/>
  <circle cx="1920" cy="1180" r="640" fill="url(#glow-sky)"/>
  <circle cx="1100" cy="900" r="380" fill="url(#glow-lilac)" opacity="0.55"/>
  <circle cx="2800" cy="860" r="420" fill="url(#glow-pink)" opacity="0.5"/>

  <!-- 柔光圆 -->
  <circle cx="680" cy="280" r="220" fill="url(#orb)"/>
  <circle cx="3180" cy="260" r="280" fill="url(#orb)"/>
  <circle cx="360" cy="980" r="160" fill="url(#orb)"/>
  <circle cx="3520" cy="980" r="200" fill="url(#orb)"/>
  <circle cx="1680" cy="180" r="120" fill="url(#orb)" opacity="0.7"/>
  <circle cx="2360" cy="160" r="100" fill="url(#orb)" opacity="0.65"/>

  <!-- 五线谱带（左侧，中部留给 Logo） -->
  <g opacity="0.9" transform="translate(180, 340)">
    <line x1="0" y1="0" x2="980" y2="0" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="48" x2="980" y2="48" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="96" x2="980" y2="96" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="144" x2="980" y2="144" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="192" x2="980" y2="192" stroke="url(#staff)" stroke-width="4"/>
  </g>
  <g opacity="0.85" transform="translate(2680, 360)">
    <line x1="0" y1="0" x2="980" y2="0" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="48" x2="980" y2="48" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="96" x2="980" y2="96" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="144" x2="980" y2="144" stroke="url(#staff)" stroke-width="4"/>
    <line x1="0" y1="192" x2="980" y2="192" stroke="url(#staff)" stroke-width="4"/>
  </g>

  <!-- 波形装饰（中上，不挡 Logo 区） -->
  <path
    d="M420 220 C720 120, 980 320, 1280 220 S1880 80, 2180 200 S2780 340, 3180 210 S3600 100, 3720 180"
    fill="none"
    stroke="url(#wave)"
    stroke-width="10"
    stroke-linecap="round"
  />
  <path
    d="M380 860 C700 760, 980 920, 1320 840 S1900 700, 2280 820 S2900 980, 3320 860 S3680 740, 3800 800"
    fill="none"
    stroke="url(#wave)"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- 音符图形（路径绘制，非文字） -->
  <!-- 左上 八分音符 -->
  <g transform="translate(780, 250)" fill="#FF8FB8" opacity="0.42">
    <ellipse cx="0" cy="78" rx="28" ry="20" transform="rotate(-20)"/>
    <rect x="22" y="0" width="10" height="78" rx="4"/>
    <path d="M32 0 C58 18, 70 42, 58 62 C78 36, 66 8, 32 0 Z"/>
  </g>
  <!-- 右上 双八分 -->
  <g transform="translate(3000, 300)" fill="#C9B8FF" opacity="0.45">
    <ellipse cx="0" cy="70" rx="24" ry="17" transform="rotate(-18)"/>
    <ellipse cx="70" cy="58" rx="24" ry="17" transform="rotate(-18)"/>
    <rect x="18" y="0" width="9" height="70" rx="3"/>
    <rect x="88" y="-12" width="9" height="70" rx="3"/>
    <path d="M27 0 H97 V18 H27 Z"/>
  </g>
  <!-- 左下 -->
  <g transform="translate(520, 720)" fill="#B8E4FF" opacity="0.5">
    <ellipse cx="0" cy="64" rx="22" ry="16" transform="rotate(-22)"/>
    <rect x="16" y="0" width="8" height="64" rx="3"/>
  </g>
  <!-- 右下 -->
  <g transform="translate(3320, 700)" fill="#FFB8D0" opacity="0.48">
    <ellipse cx="0" cy="60" rx="22" ry="16" transform="rotate(-18)"/>
    <rect x="16" y="0" width="8" height="60" rx="3"/>
    <path d="M24 0 C46 12, 54 32, 44 48 C60 28, 52 6, 24 0 Z"/>
  </g>
  <!-- 散落小音符 -->
  <g transform="translate(1100, 160)" fill="#C9B8FF" opacity="0.28">
    <ellipse cx="0" cy="36" rx="14" ry="10" transform="rotate(-20)"/>
    <rect x="10" y="0" width="5" height="36" rx="2"/>
  </g>
  <g transform="translate(2600, 200)" fill="#FF8FB8" opacity="0.28">
    <ellipse cx="0" cy="34" rx="13" ry="9" transform="rotate(-20)"/>
    <rect x="9" y="0" width="5" height="34" rx="2"/>
  </g>
  <g transform="translate(980, 780)" fill="#FFB8D0" opacity="0.3">
    <ellipse cx="0" cy="30" rx="12" ry="8" transform="rotate(-18)"/>
    <rect x="8" y="0" width="4" height="30" rx="2"/>
  </g>
  <g transform="translate(2860, 760)" fill="#B8E4FF" opacity="0.32">
    <ellipse cx="0" cy="30" rx="12" ry="8" transform="rotate(-18)"/>
    <rect x="8" y="0" width="4" height="30" rx="2"/>
  </g>

  <!-- 漂浮圆环 -->
  <circle cx="1400" cy="280" r="54" fill="none" stroke="#FF8FB8" stroke-width="6" opacity="0.22"/>
  <circle cx="2500" cy="300" r="70" fill="none" stroke="#C9B8FF" stroke-width="7" opacity="0.2"/>
  <circle cx="640" cy="640" r="42" fill="none" stroke="#B8E4FF" stroke-width="5" opacity="0.28"/>
  <circle cx="3200" cy="620" r="48" fill="none" stroke="#FFB8D0" stroke-width="5" opacity="0.26"/>

  <!-- 底部琴键条 -->
  <g opacity="0.7">
    <rect x="480" y="1030" width="2880" height="130" rx="28" fill="#FFFFFF" opacity="0.58"/>
    <g fill="#5C4A6A" opacity="0.14">
      <rect x="640" y="1030" width="42" height="84" rx="8"/>
      <rect x="860" y="1030" width="42" height="84" rx="8"/>
      <rect x="1220" y="1030" width="42" height="84" rx="8"/>
      <rect x="1440" y="1030" width="42" height="84" rx="8"/>
      <rect x="1660" y="1030" width="42" height="84" rx="8"/>
      <rect x="2020" y="1030" width="42" height="84" rx="8"/>
      <rect x="2240" y="1030" width="42" height="84" rx="8"/>
      <rect x="2600" y="1030" width="42" height="84" rx="8"/>
      <rect x="2820" y="1030" width="42" height="84" rx="8"/>
      <rect x="3040" y="1030" width="42" height="84" rx="8"/>
    </g>
  </g>
</svg>
